<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Stock In - Buy Items</title>
</head>
<body>
    <div class="navbar">
        <h2 style="color: white; margin:0;">🛠️ Hardware System</h2>
        <div><a href="/">Dashboard</a> | <a href="/purchase">Stock In</a> | <a href="/sell">Stock Out</a></div>
    </div>
    <div class="container">
        <h1>Restock / Buy Hardware Items</h1>
        <form method="POST">
            <div class="form-group">
                <label>Select Item:</label>
                <select name="item_id">
                    {% for id, item in inventory.items() %}
                        <option value="{{ id }}">{{ item.name }} (Current Stock: {{ item.stock }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Quantity to Buy:</label>
                <input type="number" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label>Buying Price per Unit (Tsh):</label>
                <input type="number" name="buying_price" required>
            </div>
            <button type="submit" class="btn">Update Stock</button>
        </form>
    </div>
</body>
</html>
